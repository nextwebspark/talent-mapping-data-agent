[project]
name = "talent-mapping-data-agent"
version = "0.1.0"
description = "HAK company enrichment agent — grounded Gemini + Supabase, deployable to Vertex AI Agent Engine."
requires-python = ">=3.11"
dependencies = [
    "google-adk>=0.5.0",
    "google-genai>=0.8.0",
    "google-cloud-aiplatform[adk,agent_engines]>=1.71.0",
    "supabase>=2.7.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
batch-run = "runner.batch_run:main"
vertex-deploy = "deploy.vertex_deploy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/tools", "src/runner", "src/deploy"]
sources = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
